services:
  - type: web
    name: speech-separation-diarization
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NUMBA_DISABLE_JIT
        value: "1"
      - key: MPLBACKEND
        value: Agg
      - key: CORS_ORIGINS
        value: https://speechlabarnob.vercel.app,http://localhost:5173,http://127.0.0.1:5173
